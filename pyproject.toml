[project]
name = "drag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "docling",          # PDF parsing + HybridChunker
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",    # EventSourceResponse for /query SSE
    "qdrant-client",
    "transformers>=5.5",  # reranker cross-encoder direct; >=5.5 fixes CVE-2025-14929 et al. (FlagEmbedding wrapper breaks on transformers v5)
    "httpx",            # async calls to llama-server (embed + LLM)
    "python-multipart", # FastAPI UploadFile support for /ingest
    "pydantic",
]

[project.optional-dependencies]
# ponytail: fallback only — load embed model in-app if llama-server endpoint fails (see "What to verify early")
fallback = ["llama-cpp-python"]

[tool.uv]
package = false
# Only ever run on Linux (image is python:3.12-slim; dev + k8s are Linux). Restricting
# the lock here drops darwin/win32/emscripten markers + their per-platform wheel hashes.
environments = ["sys_platform == 'linux'"]

# CPU-only torch. The default PyPI torch wheel drags ~2.4GB of nvidia CUDA libs +
# triton onto a stack with no GPU; pin to the PyTorch CPU index instead.
# (uv handles the +cpu local versions from this index automatically.)
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
